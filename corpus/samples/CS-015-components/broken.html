<!doctype html>
<!-- DEFECT: the tab bar spacing is a physical padding and the document never declares its language -->
<html dir="rtl">
<head>
  <meta charset="utf-8">
  <title>نوار تب‌ها</title>
  <style>
    .tab { padding-left: 14px; padding-right: 14px; }
    .tab-active { font-weight: 700; }
  </style>
</head>
<body>
  <div class="tab tab-active">خانه</div>
  <div class="tab">سبد خرید</div>
  <div class="tab">پرداخت</div>
</body>
</html>
