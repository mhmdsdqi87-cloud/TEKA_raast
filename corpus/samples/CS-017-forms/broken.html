<!doctype html>
<!-- DEFECT: the form label offset is a physical margin on the left, pushing Persian labels away from their inputs on the wrong side -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>فرم ورود</title>
  <style>
    .field label { margin-left: 10px; }
    .field input { display: block; }
  </style>
</head>
<body>
  <form class="field">
    <label for="email">نشانی ایمیل</label>
    <input id="email" type="email">
  </form>
</body>
</html>
