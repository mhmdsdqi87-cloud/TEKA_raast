[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raast"
version = "0.1.1"
description = "RTL engineering diagnostics for AI-powered development — Persian/Arabic first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mhmdsdqi87-cloud" }]
keywords = ["rtl", "persian", "farsi", "arabic", "bidi", "typography", "lint", "claude-skills", "i18n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
raast = "raast.cli:main"

[tool.setuptools.packages.find]
include = ["raast*"]

[tool.setuptools.package-data]
raast = ["py.typed"]
