  <title>تکمیل پرداخت سفارش</title>

    .checkout-hero { margin-left: 32px; }
    .checkout-hero h1 { font-size: 1.8rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="checkout-hero">
    <h1>تکمیل پرداخت</h1>
    <p>اطلاعات ارسال و پرداخت را پیش از ثبت نهایی بررسی کنید.</p>
  </main>
</body>
</html>
