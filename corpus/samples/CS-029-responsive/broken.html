<!doctype html>
<!-- DEFECT: the sidebar spacing is physical; at phone widths the media query re-sets the margin on the physical left only, so the layout collapses unevenly under RTL -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نمایش موبایل</title>
  <style>
    .sidebar { margin-left: 24px; width: 260px; }
    @media (max-width: 480px) {
      .sidebar { margin-left: 12px; width: 100%; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>فهرست محصولات</h2>
    <p>دسته‌بندی‌ها در این ستون نمایش داده می‌شوند.</p>
  </aside>
</body>
</html>
