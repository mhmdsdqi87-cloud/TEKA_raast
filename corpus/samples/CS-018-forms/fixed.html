<!doctype html>
<!-- FIX: the physical tooltip inset became inset-inline-start so the tooltip anchors to the field's reading edge -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>خطای اعتبارسنجی</title>
  <style>
    .field-wrap { position: relative; }
    .tooltip-error { position: absolute; inset-inline-start: 12px; top: -34px; background: #b00; }
  </style>
</head>
<body>
  <div class="field-wrap">
    <input type="text" aria-invalid="true">
    <span class="tooltip-error">این فیلد الزامی است.</span>
  </div>
</body>
</html>
