[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raast"
version = "0.4.1"
description = "RTL engineering diagnostics for AI-powered development — Persian, Arabic, Hebrew + Spanish LTR host."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mhmdsdqi87-cloud" }]
keywords = ["rtl", "persian", "farsi", "arabic", "hebrew", "spanish", "i18n", "l10n", "internationalization", "bidi", "typography", "lint", "claude-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = []
# Browser-backed runtime inspection (screenshots, LTR/RTL mirror diff).
# Install with: pip install 'raast[runtime]' && playwright install chromium
runtime = ["playwright>=1.40"]

[project.scripts]
raast = "raast.cli:main"
raast-review = "raast.review:main"
raast-i18n = "raast.i18n:main"
raast-inspect = "raast.runtime:main"

[tool.setuptools.packages.find]
include = ["raast*"]

[tool.setuptools.package-data]
raast = ["py.typed", "profiles/*.json"]
