name: RAAST

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rtl-doctor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: RAAST Doctor (annotations + severity gate)
        uses: mhmdsdqi87-cloud/TEKA_raast/action@main
        with:
          path: .
          language: fa
          fail-on: P0

  # Self-check: the RAAST repository validates its own engine
  raast-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Benchmark self-validation (condition C)
        run: python3 -m raast.cli benchmark --cases benchmarks/cases --candidate benchmarks/reference --condition C-reference
      - name: Bug corpus verification (every claimed rule must actually fire)
        run: python3 tools/corpus/verify.py
      - name: Compatibility matrix is fresh (regenerate → no diff)
        run: python3 tools/compat/run_matrix.py --check
      - name: i18n gate detection check (fixtures are deliberate error corpora)
        run: |
          python3 -m raast.i18n scan --locales tests/fixtures/locales --source en --format json > /tmp/i18n-report.json || true
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("/tmp/i18n-report.json"))
          rules = {f["rule"] for f in r["findings"]}
          expected = {"LQG001", "LQG002", "LQG003", "LQG004", "LQG005", "LQG006", "LQG007", "LQG008"}
          missing = expected - rules
          if missing:
              print("i18n gate failed to detect planted error classes:", sorted(missing))
              sys.exit(1)
          print(f"i18n gate detected all {len(expected)} planted error classes ({len(r['findings'])} findings)")
          EOF

  # Runtime Inspector browser tests: real headless Chromium renders the
  # calibration fixtures and every RT rule must fire. Runs in a dedicated
  # job because it needs the [runtime] extra + a Chromium download;
  # the unit-test job above runs the same module WITHOUT playwright,
  # where the browser tests self-skip and only the pure-logic layer runs.
  runtime-inspector-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with runtime extra
        run: pip install -e '.[runtime]'
      - name: Install headless Chromium
        run: playwright install --with-deps chromium
      - name: Runtime Inspector browser tests (RT001-RT006)
        run: python3 -m unittest discover -s tests -p test_runtime.py -v

  # Packaging smoke test: the wheel a real user installs MUST work outside the
  # repo (profiles shipped as package-data). Regression guard for the
  # "profile not found" bug — editable installs hide it, this job cannot.
  packaging-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --quiet build
          python3 -m build
      - name: Install wheel into clean venv (outside repo)
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/raast-*.whl
      - name: Install sdist into clean venv (outside repo)
        run: |
          python3 -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/raast-*.tar.gz
      - name: CLI must find profiles from OUTSIDE the repo
        run: |
          # Minimal clean RTL page: zero findings expected, so exit code
          # isolates "profile loading" from "severity gate".
          mkdir -p /tmp/probe
          printf '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><h1>سلام دنیا</h1><p>این یک صفحه آزمایشی است.</p></main></body></html>' > /tmp/probe/index.html
          cd /tmp
          echo "== wheel =="
          /tmp/wheel-venv/bin/raast --version
          /tmp/wheel-venv/bin/raast doctor /tmp/probe --fail-on P0 --format json > /dev/null
          echo "== sdist =="
          /tmp/sdist-venv/bin/raast --version
          /tmp/sdist-venv/bin/raast doctor /tmp/probe --fail-on P0 --format json > /dev/null
          echo "packaging OK — profiles found, doctor exits 0"
      - name: All four profiles (fa, ar, he, es) must load from OUTSIDE the repo
        run: |
          /tmp/wheel-venv/bin/raast profiles
          for lang in fa ar he es; do
            /tmp/wheel-venv/bin/raast profiles | grep -q " $lang " || { echo "missing profile: $lang"; exit 1; }
          done
          printf '<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><h1>שלום עולם</h1><p>זהו תוכן עברית לדוגמה.</p></main></body></html>' > /tmp/probe/he.html
          /tmp/wheel-venv/bin/raast doctor /tmp/probe/he.html --language he --fail-on P0 --format json > /dev/null
          printf '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><h1>Bienvenidos</h1><p>¿Cómo estamos hoy?</p><p dir="rtl">مرحبا بكم</p></main></body></html>' > /tmp/probe/es.html
          /tmp/wheel-venv/bin/raast doctor /tmp/probe/es.html --language es --fail-on P0 --format json > /dev/null
          echo "he + es profiles verified from the installed wheel"
