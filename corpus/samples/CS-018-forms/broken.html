<!doctype html>
<!-- DEFECT: the error tooltip inset is a physical left offset, so the tooltip points away from its field under RTL -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>خطای اعتبارسنجی</title>
  <style>
    .field-wrap { position: relative; }
    .tooltip-error { position: absolute; left: 12px; top: -34px; background: #b00; }
  </style>
</head>
<body>
  <div class="field-wrap">
    <input type="text" aria-invalid="true">
    <span class="tooltip-error">این فیلد الزامی است.</span>
  </div>
</body>
</html>
