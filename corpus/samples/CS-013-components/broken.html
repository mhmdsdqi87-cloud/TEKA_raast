<!doctype html>
<!-- DEFECT: the card row pins its text to the physical left edge, so Persian card copy aligns away from the reading start -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>کارت‌های دوره</title>
  <style>
    .card-row { text-align: left; }
    .card-row h3 { font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="card-row">
    <h3>دوره‌های محبوب</h3>
    <p>هر کارت شامل ویدیوها و تمرین‌های عملی است.</p>
  </div>
</body>
</html>
