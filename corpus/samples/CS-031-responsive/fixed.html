<!doctype html>
<!-- FIX: the physical cell padding became padding-inline-start so the nowrap cell hugs the correct edge at phone widths -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جدول موبایل</title>
  <style>
    .cell-actions { padding-inline-start: 12px; white-space: nowrap; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="table-wrap">
    <table>
      <tr><th>اقدام</th></tr>
      <tr><td class="cell-actions">مشاهده رسید و پیگیری مرسوله</td></tr>
    </table>
  </div>
</body>
</html>
