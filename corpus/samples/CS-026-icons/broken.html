<!doctype html>
<!-- DEFECT: the gap between each menu icon and its label is a physical margin on the left, so the spacing flips to the outer side under RTL -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>منوی آیکن‌دار</title>
  <style>
    .menu-item .label { margin-left: 8px; }
    .menu-item { display: flex; align-items: center; }
  </style>
</head>
<body>
  <div class="menu-item"><span aria-hidden="true">⌂</span><span class="label">پروفایل</span></div>
  <div class="menu-item"><span aria-hidden="true">⚙</span><span class="label">تنظیمات</span></div>
</body>
</html>
