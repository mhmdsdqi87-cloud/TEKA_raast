<!doctype html>
<!-- DEFECT: letter spacing is applied to an Arabic heading; joined Arabic glyphs shatter into separated letters -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>عروض اليوم</title>
  <style>
    .headline { letter-spacing: 0.08em; font-weight: 700; }
    .headline small { font-weight: 400; }
  </style>
</head>
<body>
  <h1 class="headline">تسوق بثقة كل يوم</h1>
  <p>عروض يومية على مئات المنتجات المختارة.</p>
</body>
</html>
