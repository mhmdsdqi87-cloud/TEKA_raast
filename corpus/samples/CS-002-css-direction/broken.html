<!doctype html>
<!-- DEFECT: the product card inner spacing is a physical padding on the right edge, so text hugs the wrong border under RTL -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>کارت محصول</title>
  <style>
    .product-card { padding-right: 16px; border: 1px solid #ddd; }
    .product-card h2 { font-size: 1.2rem; }
  </style>
</head>
<body>
  <section class="product-card">
    <h2>گوشی هوشمند مدل X</h2>
    <p>با گارانتی رسمی و ارسال سریع به سراسر کشور.</p>
  </section>
</body>
</html>
