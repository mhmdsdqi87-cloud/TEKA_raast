<!doctype html>
<!-- FIX: the physical left inset became inset-inline-start so the badge follows the inline start corner in both directions -->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>بنر تخفیف</title>
  <style>
    .promo { position: relative; }
    .badge { position: absolute; inset-inline-start: 8px; top: 8px; background: #c00; }
  </style>
</head>
<body>
  <div class="promo">
    <span class="badge">تخفیف ویژه</span>
    <p>این تخفیف فقط تا پایان هفته اعتبار دارد.</p>
  </div>
</body>
</html>
